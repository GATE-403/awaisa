name: CI

# Actions minutes are paid, so the heavy part runs once a day, not on every pull request:
# - a pull request gets only `check` (lint, types, unit tests, build: one job, a few minutes);
# - the e2e suite (five jobs, each building the apps against its own database) runs every night
#   on feat/booking-mvp, and only when something was merged since the last night;
# - a pull request labelled `e2e` (a risky change) gets the suite too, and «Run workflow» starts it
#   by hand. A failed night is texted to the alerts chat when its secrets are set.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # 02:00 in Bishkek, an hour before the UX kit.
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  # Adding a label must not cancel the code check of the same pull request.
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true

jobs:
  # The nightly run is skipped when nothing was merged in the last day.
  changes:
    name: Anything new today
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fresh: ${{ steps.log.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - id: log
        run: |
          if [ -n "$(git log --since='25 hours ago' --format=%h | head -1)" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, types, unit tests, build
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          API_URL: http://localhost:4000

  # The suite is split into shards, each a job with its own Postgres and Redis (specs share one
  # database within a run, so they cannot run side by side in one job), started at once beside
  # `check` instead of after it. Desktop has the most specs, so it gets a shard more. Playwright
  # splits by spec file. Wall time went from ~10 min (check, then two jobs of 4 and 6 min) to
  # about the slowest shard.
  e2e:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }})
    needs: changes
    if: >-
      always() && (
        github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && needs.changes.outputs.fresh == 'true') ||
        (github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'e2e') &&
          (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: mobile, shard: 1/2 }
          - { project: mobile, shard: 2/2 }
          - { project: desktop, shard: 1/3 }
          - { project: desktop, shard: 2/3 }
          - { project: desktop, shard: 3/3 }
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: awaisa
          POSTGRES_PASSWORD: awaisa
          POSTGRES_DB: awaisa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U awaisa -d awaisa"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Migrate and seed demo data
        run: |
          pnpm --filter @awaisa/tokens --filter @awaisa/ui --if-present build
          pnpm --filter api build
          pnpm --filter api migrate
          pnpm db:seed
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Next's build cache: unchanged pages are not compiled again.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next-e2e/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter web exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Report name
        if: failure()
        id: report
        run: echo "name=e2e-report-${{ matrix.project }}-$(echo '${{ matrix.shard }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ steps.report.outputs.name }}
          path: |
            apps/web/e2e-report
            apps/web/e2e-results
          retention-days: 7

  # Nobody watches a night run: a failure is texted to the same chat as the uptime alerts.
  notify:
    name: Tell the alerts chat
    needs: e2e
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=Ночные e2e-тесты упали: $RUN_URL"
