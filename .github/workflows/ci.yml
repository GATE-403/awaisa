name: CI

on:
  pull_request:
  push:
    branches: [main, feat/booking-mvp]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          API_URL: http://localhost:4000

  # The phone and desktop projects run side by side, each with its own Postgres and Redis, so
  # the suite takes about half the time it does in one job.
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: awaisa
          POSTGRES_PASSWORD: awaisa
          POSTGRES_DB: awaisa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U awaisa -d awaisa"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Migrate and seed demo data
        run: |
          pnpm --filter @awaisa/tokens --filter @awaisa/ui --if-present build
          pnpm --filter api build
          pnpm --filter api migrate
          pnpm db:seed
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Next's build cache: unchanged pages are not compiled again.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next-e2e/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter web exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            apps/web/e2e-report
            apps/web/e2e-results
          retention-days: 7
