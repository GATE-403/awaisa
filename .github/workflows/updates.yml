# «Что нового»: when a PR merges, its «## Что нового» section becomes entries on /updates
# (apps/web/src/shared/config/updates.json, read by shared/config/updates.ts).
name: Что нового

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: updates-json
  cancel-in-progress: false

jobs:
  copy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          # main only takes pull requests with green CI; this deploy key is the ruleset's one
          # bypass, so the release notes can still be committed straight to it.
          ssh-key: ${{ secrets.UPDATES_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the parser
        run: node --test .github/scripts/updates-from-pr.test.mjs
      - name: Copy the PR's entries
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: node .github/scripts/updates-from-pr.mjs
      - name: Commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/shared/config/updates.json
          git commit -m "chore(updates): add release notes from #${PR_NUMBER}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_BASE_REF" && git push && exit 0
            sleep 5
          done
          exit 1
