x-api-env: &api-env
  NODE_ENV: production
  API_PORT: 4000
  DATABASE_URL: postgres://${POSTGRES_USER:-awaisa}:${POSTGRES_PASSWORD:-awaisa}@postgres:5432/${POSTGRES_DB:-awaisa}
  REDIS_URL: redis://redis:6379
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  TRUST_PROXY: ${TRUST_PROXY:-}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
  AUTH_SECRET: ${AUTH_SECRET:-}
  ADMIN_PHONES: ${ADMIN_PHONES:-}
  SMS_DRIVER: ${SMS_DRIVER:-}
  SMS_ALLOWED_COUNTRY_CODES: ${SMS_ALLOWED_COUNTRY_CODES:-996}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
  TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
  WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
  WHATSAPP_LANGUAGE: ${WHATSAPP_LANGUAGE:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  GEOCODER: ${GEOCODER:-photon}
  PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
  ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  BOOKING_RATE_LIMIT_PER_MINUTE: ${BOOKING_RATE_LIMIT_PER_MINUTE:-5}
  AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-5}
  PAYMENT_DRIVER: ${PAYMENT_DRIVER:-}
  RECS_INTERLEAVE: ${RECS_INTERLEAVE:-}
  FREEDOMPAY_MERCHANT_ID: ${FREEDOMPAY_MERCHANT_ID:-}
  FREEDOMPAY_SECRET_KEY: ${FREEDOMPAY_SECRET_KEY:-}
  FREEDOMPAY_API_URL: ${FREEDOMPAY_API_URL:-}
  FREEDOMPAY_CURRENCY: ${FREEDOMPAY_CURRENCY:-}
  FREEDOMPAY_TESTING_MODE: ${FREEDOMPAY_TESTING_MODE:-}
  FISCAL_DRIVER: ${FISCAL_DRIVER:-}
  EKASSA_API_URL: ${EKASSA_API_URL:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-}
  UPLOAD_DIR: /data/uploads
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  WALLET_PASS_TYPE_ID: ${WALLET_PASS_TYPE_ID:-}
  WALLET_TEAM_ID: ${WALLET_TEAM_ID:-}
  WALLET_CERT_PEM: ${WALLET_CERT_PEM:-}
  WALLET_KEY_PEM: ${WALLET_KEY_PEM:-}
  WALLET_KEY_PASSPHRASE: ${WALLET_KEY_PASSPHRASE:-}
  WALLET_WWDR_PEM: ${WALLET_WWDR_PEM:-}
  GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
  GOOGLE_WALLET_SERVICE_ACCOUNT: ${GOOGLE_WALLET_SERVICE_ACCOUNT:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # pg_stat_statements: which queries take the most time in total (pnpm --filter api db:slow).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-awaisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-awaisa}
      POSTGRES_DB: ${POSTGRES_DB:-awaisa}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache for public API answers (catalog, free time). Optional: without REDIS_URL the API keeps
  # a small cache in its own memory.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The app's images: built here by `--build`, or pulled from GHCR by scripts/deploy.sh, which sets
  # API_IMAGE / WEB_IMAGE to ghcr.io/glassmakers/awaisa-api|web and IMAGE_TAG to the commit.

  # Applies migrations once per deploy; api and worker start only after it succeeds.
  migrate:
    image: ${API_IMAGE:-awaisa-api}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [app]
    command: ["node", "dist/database/migrate.js"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  # HTTP only (PROCESS_ROLE=api): scale it freely, e.g. `docker compose up --scale api=3`.
  api:
    image: ${API_IMAGE:-awaisa-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: [app]
    environment:
      <<: *api-env
      PROCESS_ROLE: api
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Cron jobs and the Telegram long-poll. Exactly one replica.
  worker:
    image: ${API_IMAGE:-awaisa-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    profiles: [app]
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
      PROCESS_ROLE: worker
      # Nightly recounts read months of visits; the jobs need few connections but more time.
      DATABASE_POOL_SIZE: 4
      DATABASE_STATEMENT_TIMEOUT_MS: 300000
    volumes:
      - uploads:/data/uploads
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Database copies: one at start, then every BACKUP_EVERY_HOURS, the last BACKUP_KEEP_DAYS kept
  # in the `backups` volume (scripts/db-backup.sh). Sync that volume off this server as well.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    profiles: [app]
    entrypoint: ["sh", "/scripts/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-awaisa}
      PGPASSWORD: ${POSTGRES_PASSWORD:-awaisa}
      PGDATABASE: ${POSTGRES_DB:-awaisa}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
    volumes:
      - backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-awaisa-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://awaisa.kg}
        NEXT_PUBLIC_MAP_TILES_URL: ${NEXT_PUBLIC_MAP_TILES_URL:-}
        NEXT_PUBLIC_MAP_TILES_URL_DARK: ${NEXT_PUBLIC_MAP_TILES_URL_DARK:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION_DARK: ${NEXT_PUBLIC_MAP_ATTRIBUTION_DARK:-}
    restart: unless-stopped
    profiles: [app]
    environment:
      API_URL: http://api:4000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
  backups:
